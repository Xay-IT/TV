<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast TS Stream Player</title>
    
    <!-- Preconnect เร่งการเชื่อมต่อกับเซิร์ฟเวอร์สตรีม -->
    <link rel="preconnect" href="http://6395online.com:8080">
    <link rel="dns-prefetch" href="http://6395online.com:8080">

    <!-- mpegts.js ไลบรารีสำหรับเล่นไฟล์ .ts ให้โหลดไว ลื่นไหล ไม่กินสเปก -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="videoElement" controls autoplay muted playsinline preload="auto"></video>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const streamUrl = 'http://6395online.com:8080/live/Chandasack9066/9066/295.ts';

        if (mpegts.getFeatureList().mseLivePlayback) {
            const player = mpegts.createPlayer({
                type: 'mse',           // ใช้ Media Source Extensions เพื่อความลื่นไหล
                isLive: true,          // กำหนดเป็น Live Stream
                url: streamUrl
            }, {
                enableStashBuffer: false,        // ปิดการดักบัฟเฟอร์ก้อนใหญ่ เพื่อให้ภาพขึ้นไวที่สุด (Low Latency)
                stashInitialSize: 128,           // โหลดข้อมูลแค่ 128KB แรกก็พร้อมแสดงภาพทันที
                liveBufferLatencyChasing: true,  // ไล่ตามเฟรมล่าสุดตลอดเวลา ป้องกันภาพดีเลย์หรือสะดุด
                enableWorker: true,              // แยกประมวลผลวิดีโอบน Background Worker ไม่ทำให้หน้าเว็บค้าง
                lazyLoad: false
            });

            player.attachMediaElement(videoElement);
            player.load();
            
            // เล่นวิดีโอทันทีที่พร้อม
            player.play().catch(error => {
                console.log("Autoplay blocked, user interaction needed:", error);
            });

            // ดักจับ Error และพยายามโหลดใหม่ให้อัตโนมัติหากสัญญาณขาดหาย
            player.on(mpegts.Events.ERROR, (errorType, errorDetail, errorInfo) => {
                console.warn('Stream Error occurred, attempting to reload...', errorType, errorDetail);
                setTimeout(() => {
                    player.unload();
                    player.load();
                    player.play();
                }, 2000);
            });
        } else {
            // Fallback สำหรับเบราว์เซอร์ย่อยที่เล่นไฟล์ Native สตรีมได้ตรงๆ
            videoElement.src = streamUrl;
            videoElement.play();
        }
    </script>

</body>
</html>
