<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ClearKey DASH Player</title>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
</head>
<body>

<video id="videoPlayer" controls autoplay width="100%"></video>

<script>
  const url = "https://cri-streamer3.cdn.3bbtv.com:8443/3bb/live/33/33.mpd";

  const player = dashjs.MediaPlayer().create();

  player.setProtectionData({
    "org.w3.clearkey": {
      "clearkeys": {
        "9d76aea451d441a4913d4d70c4e586ab": "051027a6ff54494b949ba792928e9008"
      }
    }
  });

  player.initialize(document.querySelector("#videoPlayer"), url, true);
</script>

</body>
</html>
