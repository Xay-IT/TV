<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>TS Player</title>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js/dist/mpegts.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<video id="video" controls autoplay muted></video>

<script>
  if (mpegts.getFeatureList().mseLivePlayback) {
    const player = mpegts.createPlayer({
      type: 'mse',
      isLive: true,
      url: 'http://43.229.79.245:8080/live/premier/reimerp/20.ts'
    });
    player.attachMediaElement(document.getElementById('video'));
    player.load();
    player.play();
  } else {
    alert('Browser ไม่รองรับ');
  }
</script>

</body>
</html>
