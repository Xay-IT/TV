<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
    body {
        margin: 0;
        background: #000;
    }
    video {
        width: 100%;
        height: 100vh;
        background: #000;
    }
</style>
</head>
<body>

<video id="video" controls autoplay></video>

<script>
    var video = document.getElementById('video');
    var videoSrc = 'http://43.229.79.245:8080/live/premier/reimerp/20.ts';

    if (Hls.isSupported()) {
        var hls = new Hls({
            liveSyncDuration: 3
        });
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
    } else if (video.canPlayType('video/mp2t')) {
        video.src = videoSrc;
    }
</script>

</body>
</html>
