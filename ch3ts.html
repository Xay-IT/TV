<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>CH3 HD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@0.4.0/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/level-selector@latest/dist/level-selector.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-pip@latest/dist/clappr-pip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-playback-rate-plugin@latest/dist/clappr-playback-rate-plugin.min.js"></script>
    <!-- โหลด HLS.js และ Clappr HLS Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-hlsjs-playback@latest/dist/clappr-hlsjs-playback.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #player {
            width: 100vw;
            height: 100vh;
        }
        [data-player] {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        // ไฟล์ .ts โดยตรงมักมีปัญหา CORS และ Codec บนเบราว์เซอร์
        var videoUrl = 'http://43.229.79.245:8080/live/premier/reimerp/20.ts';

        // ฟังก์ชันตรวจสอบและดึงปลั๊กอินที่ใช้งานได้จริงเพื่อป้องกัน TypeError
        function getPlugins() {
            var p = [];
            if (window.HlsjsPlayback) p.push(window.HlsjsPlayback);
            else if (window.ClapprHlsjsPlayback) p.push(window.ClapprHlsjsPlayback);
            
            if (window.LevelSelector) p.push(window.LevelSelector);
            if (window.Clappr && window.Clappr.PIPPlugin) p.push(window.Clappr.PIPPlugin);
            if (window.Clappr && window.Clappr.PlaybackRatePlugin) p.push(window.Clappr.PlaybackRatePlugin);
            
            return p;
        }

        var player = new Clappr.Player({
            source: videoUrl,
            // สำหรับ .ts แนะนำให้ใช้ video/mp2t หรือปล่อยให้ Clappr ตัดสินใจเอง
            // หากใช้ application/x-mpegURL ต้องมั่นใจว่าไฟล์เป็นโครงสร้าง HLS
            mimeType: 'video/mp2t', 
            height: '100%',
            width: '100%',
            autoPlay: true,
            muted: true,
            plugins: getPlugins(),
            parentId: '#player',
            hlsjsConfig: {
                enableWorker: true,
            },
            events: {
                onReady: function() {
                    var plugin = this.getPlugin('click_to_pause');
                    if (plugin) plugin.disable();
                },
                onError: function(e) {
                    console.error('Player Error:', e);
                }
            }
        });
    </script>
</body>
</html>
