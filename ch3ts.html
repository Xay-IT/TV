<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
video {
  width: 100%;
  height: 100%;
  background: black;
}
</style>
</head>

<body>

<video id="video" controls autoplay muted playsinline></video>

<script>
  var video = document.getElementById('video');
  var url = "http://43.229.79.245:8080/live/premier/reimerp/20.ts";

  if (mpegts.isSupported()) {
    var player = mpegts.createPlayer({
      type: 'mse',
      isLive: true,
      url: url
    });

    player.attachMediaElement(video);
    player.load();
    player.play();
  } else {
    video.outerHTML = "<p style='color:white;text-align:center'>Browser ไม่รองรับ</p>";
  }
</script>

</body>
</html>
