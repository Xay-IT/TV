<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>CH3 HD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    
    <!-- Scripts: เพิ่ม HLS Playback เพื่อรองรับไฟล์ .ts / .m3u8 ได้ดีขึ้น -->
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@0.4.0/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/level-selector@latest/dist/level-selector.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-pip@latest/dist/clappr-pip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-playback-rate-plugin@latest/dist/clappr-playback-rate-plugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr-hlsjs-playback@latest/dist/clappr-hlsjs-playback.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #player {
            width: 100vw;
            height: 100vh;
        }
        [data-player] {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        /**
         * สาเหตุของจอดำที่เป็นไปได้:
         * 1. Mixed Content: หากเว็บนี้รันบน https:// แต่ URL วิดีโอเป็น http:// เบราว์เซอร์จะบล็อก
         * 2. Codec: ไฟล์ .ts บางประเภทเบราว์เซอร์ไม่รองรับการถอดรหัสโดยตรง
         * 3. Source Offline: ลิงก์ต้นทางอาจจะปิดอยู่หรือจำกัด IP
         */
        var videoUrl = 'http://43.229.79.245:8080/live/premier/reimerp/20.ts';

        var player = new Clappr.Player({
            source: videoUrl,
            // พยายามบังคับให้ใช้ HLS Playback หรือถอดรหัส MPEG-TS
            mimeType: 'application/x-mpegURL', 
            height: '100%',
            width: '100%',
            autoPlay: true,
            muted: true, // Chrome บล็อกวิดีโอที่มีเสียงไม่ให้เล่นเอง
            plugins: [
                HlsjsPlayback, 
                LevelSelector, 
                Clappr.PIPPlugin, 
                Clappr.PlaybackRatePlugin
            ],
            parentId: '#player',
            hlsjsConfig: {
                enableWorker: true,
                lowLatencyMode: true,
            },
            events: {
                onReady: function() {
                    var plugin = this.getPlugin('click_to_pause');
                    if (plugin) plugin.disable();
                },
                onError: function(e) {
                    console.error('Player Error:', e);
                    // ถ้าจอดำ อาจเกิดจาก Error ตรงนี้
                }
            }
        });
    </script>
</body>
</html>
