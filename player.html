<!DOCTYPE html>
<html>
<head>
<title>CH3 HD - Live Player</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,shrink-to-fit=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #000; width: 100%; height: 100%; overflow: hidden; }
#player { width: 100%; height: 100vh; }
#msg {
    color: #fff; font-family: sans-serif; font-size: 14px;
    padding: 20px; display: none; line-height: 1.8;
}
</style>
</head>
<body>

<div id="player"></div>
<div id="msg"></div>

<!--
  วิธีที่ 1: วางไฟล์ clappr.min.js ไว้ในโฟลเดอร์เดียวกับ HTML นี้
  ดาวน์โหลดได้ที่: https://cdn.jsdelivr.net/npm/@clappr/player@0.3.6/dist/clappr.min.js
-->
<script src="clappr.min.js"></script>

<script>
  if (typeof Clappr === 'undefined') {
      // วิธีที่ 2: โหลดผ่าน script tag แบบ dynamic เพื่อลอง CDN อื่น
      var cdnList = [
          'https://cdn.jsdelivr.net/npm/@clappr/player@0.3.6/dist/clappr.min.js',
          'https://unpkg.com/@clappr/player@0.3.6/dist/clappr.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/clappr/0.3.6/clappr.min.js'
      ];

      var tried = 0;

      function tryLoad() {
          if (tried >= cdnList.length) {
              document.getElementById('msg').style.display = 'block';
              document.getElementById('msg').innerHTML =
                  '❌ โหลด Clappr ไม่ได้จากทุก CDN<br><br>' +
                  'กรุณาดาวน์โหลดไฟล์นี้แล้ววางไว้ในโฟลเดอร์เดียวกับ HTML:<br>' +
                  '<a href="https://cdn.jsdelivr.net/npm/@clappr/player@0.3.6/dist/clappr.min.js" ' +
                  'style="color:#4af">clappr.min.js</a>';
              return;
          }
          var s = document.createElement('script');
          s.src = cdnList[tried++];
          s.onload = initPlayer;
          s.onerror = tryLoad;
          document.head.appendChild(s);
      }

      tryLoad();
  } else {
      initPlayer();
  }

  function initPlayer() {
      if (typeof Clappr === 'undefined') return;

      new Clappr.Player({
          source: 'https://www.livedoomovies.com:4431/02_3HD_720p/playlist.m3u8',
          mimeType: 'application/x-mpegURL',
          height: '100%',
          width: '100%',
          autoPlay: true,
          events: {
              onReady: function() {
                  var p = this.getPlugin('click_to_pause');
                  p && p.disable();
              }
          },
          hlsjsConfig: {
              xhrSetup: function(xhr) {
                  xhr.setRequestHeader(
                      'User-Agent',
                      'Mozilla/5.0 (Linux; Android 7.1.2; TV BOX Build/NHG47L) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/56.0.2924.87 Safari/537.36'
                  );
              }
          },
          parentId: '#player'
      });
  }
</script>

</body>
</html>
