<div id="hisports-player" style="width: 100%; max-width: 800px; margin: auto;">
    <video id="videoElement" controls autoplay muted style="width: 100%; height: auto; background: #000;"></video>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <script>
        if (mpegts.getFeatureList().mse) {
            var videoElement = document.getElementById('videoElement');
            var player = mpegts.createPlayer({
                type: 'mse',
                isLive: true,
                url: 'http://49.0.64.96:8007/HiSports'
            });
            player.attachMediaElement(videoElement);
            player.load();
            player.play();
        }
    </script>
</div>
