<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HiSports Player</title>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest"></script>
</head>
<body style="margin:0;background:#000;">

<video id="video" controls autoplay style="width:100%;height:100vh;"></video>

<script>
if (mpegts.getFeatureList().mseLivePlayback) {
    var player = mpegts.createPlayer({
        type: 'mpegts',
        isLive: true,
        url: 'http://49.0.64.96:8007/HiSports'
    });

    player.attachMediaElement(document.getElementById('video'));
    player.load();
    player.play();
}
</script>

</body>
</html>
